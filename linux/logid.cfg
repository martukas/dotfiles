devices: ({
  name: "MX Anywhere 3S";

  buttons: (
    { cid: 0x52; action = { type: "ToggleSmartShift"; }; },
    { cid: 0xc4; action = { type: "Keypress"; keys: ["BTN_MIDDLE"]; }; },
    { cid: 0x53; action = { type: "Keypress"; keys: ["KEY_BACK"]; }; },
    { cid: 0x56; action = { type: "Keypress"; keys: ["KEY_FORWARD"]; }; }
  );

  hiresscroll: {
    hires: true;
  };

}, {
  // Without an explicit block the wheel reports raw un-multiplied ticks --
  // 8 units per detent instead of 120 -- so libinput needs 15 detents to
  // register one scroll. Same defect as the MX Anywhere 3S had before hires
  // mode was set; the fix is per-device because logid matches on name.
  name: "MX Master 3S";

  // Same swap as the Anywhere: wheel press toggles the ratchet, and the
  // mode-shift button behind the wheel becomes middle click.
  buttons: (
    { cid: 0x52; action = { type: "ToggleSmartShift"; }; },
    { cid: 0xc4; action = { type: "Keypress"; keys: ["BTN_MIDDLE"]; }; }
  );

  hiresscroll: {
    hires: true;
  };

});
